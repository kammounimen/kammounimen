<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img"><rect x="0.5" y="0.5" width="899" height="169" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/><text x="40" y="45" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" >Élève ingénieure en Génie Informatique à l'ENIS, je conçois des applications intelligentes,</text><text x="40" y="71" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" >de l'infrastructure jusqu'aux modèles d'IA : agents LLM, machine learning, Big Data,</text><text x="40" y="97" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" >développement web full-stack et sécurité (DevSecOps).</text><text x="40" y="123" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400" fill="#1F2937" >Je recherche un stage où mettre ces compétences au service d'un projet concret.</text></svg>