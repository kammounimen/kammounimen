id="ag0"><rect width="358" height="196" rx="20"/></clipPath><g clip-path="url(#ag0)"><g transform="skewX(-22)"><rect x="-260" y="-20" width="110" height="236" fill="url(#gl)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;878 0;878 0" keyTimes="0;0.00;0.45;1" dur="6s" repeatCount="indefinite"/></rect></g></g></g></g><g transform="translate(422,176)"><g class="br" style="animation-delay:-1.1s"><rect width="358" height="196" rx="20" fill="#fff" fill-opacity=".06" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="1.5"/><rect width="358" height="196" rx="20" fill="none" stroke="url(#vm)" stroke-width="2.5" pathLength="1000" stroke-dasharray="90 910" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="7s" repeatCount="indefinite"/></rect><circle cx="52" cy="52" r="34" fill="none" stroke="#8B5CF6" stroke-opacity=".6" stroke-width="2" stroke-dasharray="5 6" class="sp"/><circle cx="52" cy="52" r="26" fill="url(#vm)" filter="url(#glow)"/><g transform="translate(39.4,39.4) scale(1.05)" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5h6v2M3 13h18"/></g><text x="100" y="62" font-family="Georgia,'Times New Roman','DejaVu Serif',serif" font-size="24" fill="#F5F3FF">Situation actuelle</text><text x="24" y="112" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#B7A9E6">Élève ingénieure en 3ème année à l&#x27;ENIS.</text><text x="24" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#B7A9E6">Stages réalisés chez KPIT Technologies</text><text x="24" y="164" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15.5" fill="#B7A9E6">(2025) et ICT (2026).</text><clipPath id="ag1"><rect width="358" height="196" rx="20"/></clipPath><g clip-path="url(#ag1)"><g transform="skewX(-22)"><rect x="-260" y="-20" width="110" height="236" fill="url(#gl)"><an