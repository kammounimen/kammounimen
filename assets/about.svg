<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500"><style>.fb{transform-box:fill-box;transform-origin:center}.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}.br{animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.bn{animation:bn 1.2s ease-in-out infinite}@keyframes bn{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}.bk{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.ch{animation:ch 1.8s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.15}50%{opacity:1}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0720"/><stop offset="1" stop-color="#1E1048"/></linearGradient><linearGradient id="vm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter></defs><rect width="1200" height="500" rx="22" fill="url(#bg)"/><text x="44" y="70" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fil