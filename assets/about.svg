egular',Consolas,'Liberation Mono',monospace" font-size="16" opacity="1"><tspan fill="#22D3EE">&#160;&#160;nom:&#160;</tspan><tspan fill="#86EFAC">&quot;Imen&#160;Kammoun&quot;</tspan><tspan fill="#A99BD9">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.07;0.11;.92;1" dur="12s" repeatCount="indefinite"/></text><text x="664" y="162" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" opacity="1"><tspan fill="#22D3EE">&#160;&#160;école:&#160;</tspan><tspan fill="#86EFAC">&quot;ENIS&#160;·&#160;Génie&#160;Info&quot;</tspan><tspan fill="#A99BD9">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.18;.92;1" dur="12s" repeatCount="indefinite"/></text><text x="664" y="192" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" opacity="1"><tspan fill="#22D3EE">&#160;&#160;niveau:&#160;</tspan><tspan fill="#86EFAC">&quot;3ème&#160;année&quot;</tspan><tspan fill="#A99BD9">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.21;0.25;.92;1" dur="12s" repeatCount="indefinite"/></text><text x="664" y="222" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" opacity="1"><tspan fill="#22D3EE">&#160;&#160;focus:&#160;</tspan><tspan fill="#86EFAC">[&quot;Agents&#160;IA&quot;,&#160;&quot;RAG&quot;,&#160;&quot;Full-Stack&quot;]</tspan><tspan fill="#A99BD9">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.28;0.32;.92;1" dur="12s" repeatCount="indefinite"/></text><text x="664" y="252" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="16" opacity="1"><tspan fill="#22D3EE">&#160;&#160;stages:&#160;</tspan><tspan fill="#86EFAC">[&quot;ICT&#160;2026&quot;,&#160;&quot;KPIT&#160;2025&quot;]</tspan><tspan fill="#A99BD9">,</tspan><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.35;0.39;.92;1" dur="12s" repeatCount="indefinite"/></text><text x="664" y="282" fon