 text-anchor="middle" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2937">Agents IA</text><rect x="185.8" y="296" width="108" height="30" rx="15" fill="#FFFFFF" stroke="#E5E7EB"/><text x="240" y="316" text-anchor="middle" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2937">Full-Stack</text><rect x="303.8" y="296" width="182" height="30" rx="15" fill="#FFFFFF" stroke="#E5E7EB"/><text x="395" y="316" text-anchor="middle" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2937">Systèmes distribués</text><g class="br" style="animation-delay:-0.0s"><rect x="670" y="36" width="235" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="696" y="120" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#1F2937">2</text><text x="696" y="156" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B7280">Stages en entreprise</text></g><g class="br" style="animation-delay:-0.9s"><rect x="925" y="36" width="235" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="951" y="120" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#1F2937">5</text><text x="951" y="156" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B7280">Projets techniques</text></g><g class="br" style="animation-delay:-1.8s"><rect x="670" y="206" width="235" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="696" y="290" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#1F2937">200</text><text x="696" y="326" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B7280">Rang concours national</text></g><g class="br" style="animation-delay:-2.7s"><rect x="925" y="206" width="235" height="150" rx="22" fill="#FFFFFF" filter="url(#sh)"/><text x="951" y="290" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="58" font-weight="800" fill="#1F2937">3ème</text><text x="951" y="326" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="600" fill="#6B7280">année cycle ingénieur</text></g><rect x="40" y="384" width="1120" height="56" rx="28" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/><circle cx="76" cy="412" r="7" fill="#D6336C" class="pu"/><text x="98" y="418" font-family="'Avenir Next','Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#1F2937">Je recherche un stage où la technologie crée de la valeur : IA, Full-Stack et ingénierie logicielle.</text><clipPath id="ag"><rect width="1200" height="470" rx="28"/></clipPath><g clip-path="url(#ag)"><g transform="skewX(-20)"><rect x="-300" y="-20" width="140" height="510" fill="url(#gl)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;1820 0;1820 0" keyTimes="0;0.22;0.62;1" dur="9s" repeatCount="indefinite"/></rect></g></g></svg>