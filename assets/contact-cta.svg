<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230"><style>.fb{transform-box:fill-box;transform-origin:center}.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}.br{animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.bn{animation:bn 1.2s ease-in-out infinite}@keyframes bn{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}.bk{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.ch{animation:ch 1.8s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.15}50%{opacity:1}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0720"/><stop offset="1" stop-color="#1E1048"/></linearGradient><linearGradient id="vm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter></defs><rect width="1200" height="230" rx="22" fill="url(#bg)"/><circle cx="1000" cy="60" r="150" fill="#D946EF" opacity=".3" filter="url(#blur)" class="fl"/><circle cx="150" cy="230" r="130" fill="#8B5CF6" opacity=".4" filter="url(#blur)" class="fl" style="animation-delay:-2s"/><text x="60" y="100" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="42" font-weight="800" fill="#F5F3FF">Discutons de votre <tspan fill="url(#vm)">prochain projet</tspan></text><text x="60" y="146" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#A99BD9">Je recherche un stage — écrivez-moi, je réponds rapidement.</text><path d="M1040,82 l18,18 l-18,18" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="ch" style="animation-delay:0.0s"/><path d="M1074,82 l18,18 l-18,18" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="ch" style="animation-delay:0.3s"/><path d="M1108,82 l18,18 l-18,18" fill="none" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" class="ch" style="animation-delay:0.6s"/><rect x="60" y="176" width="140" height="4" rx="2" fill="url(#vm)"/></svg>