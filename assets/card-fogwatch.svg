<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300"><style>.fb{transform-box:fill-box;transform-origin:center}.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}.br{animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.bn{animation:bn 1.2s ease-in-out infinite}@keyframes bn{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}.bk{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.ch{animation:ch 1.8s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.15}50%{opacity:1}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0720"/><stop offset="1" stop-color="#1E1048"/></linearGradient><linearGradient id="vm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter></defs><rect width="590" height="300" rx="22" fill="url(#bg)"/><text x="560" y="150" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="130" font-weight="800" fill="#8B5CF6" opacity=".08">01</text><circle cx="520" cy="20" r="70" fill="#D946EF" opacity=".25" filter="url(#blur)" class="fl"/><rect x="1.5" y="1.5" width="587" height="297" rx="21" fill="none" stroke="#8B5CF6" stroke-opacity=".35" stroke-width="2"/><rect x="1.5" y="1.5" width="587" height="297" rx="21" fill="none" stroke="url(#vm)" stroke-width="3" pathLength="1000" stroke-dasharray="110 890" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect><rect x="487.0" y="24" width="77.0" height="26" rx="13" fill="url(#vm)"/><text x="525.5" y="42" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff">Équipe</text><text x="26" y="56" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#F5F3FF">FogWatch</text><text x="26" y="84" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#22D3EE">Détection collaborative d&#x27;attaques · Fog Computing</text><text x="26" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E4DCFF">Système distribué sur 3 sites : Suricata détecte, un corrélateur</text><text x="26" y="145" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E4DCFF">agrège les événements via MQTT et ordonne un blocage nftables.</text><text x="26" y="168" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E4DCFF">Comparaison chiffrée : mode isolé vs mode collaboratif.</text><rect x="26" y="214" width="92" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="72" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">Suricata</text><rect x="127.6" y="214" width="51" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="153" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">K3s</text><rect x="188.2" y="214" width="59" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="218" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">MQTT</text><rect x="257.0" y="214" width="100" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="307" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">Tailscale</text><g transform="translate(376,250)"><clipPath id="bfogwatch"><rect width="192" height="40" rx="20"/></clipPath><rect width="192" height="40" rx="20" fill="url(#vm)" filter="url(#glow)" class="br"/><g clip-path="url(#bfogwatch)"><rect x="-60" width="60" height="40" fill="url(#gl)"><animateTransform attributeName="transform" type="translate" from="0 0" to="312 0" dur="2.6s" repeatCount="indefinite"/></rect></g><text x="22" y="26" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#fff">Voir le dépôt</text><g class="bn" transform="translate(152,0)"><path d="M0,20 H18 M12,13 L19,20 L12,27" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g><g id="gleamX"><path d="M422,107 L423.6,111.4 L428,113 L423.6,114.6 L422,119 L420.4,114.6 L416,113 L420.4,111.4Z" fill="#fff" class="tw" style="animation-delay:-1.32s" filter="url(#glow)"/><path d="M253,99 L254.6,103.4 L259,105 L254.6,106.6 L253,111 L251.4,106.6 L247,105 L251.4,103.4Z" fill="#fff" class="tw" style="animation-delay:-2.60s" filter="url(#glow)"/><path d="M228,100 L229.6,104.4 L234,106 L229.6,107.6 L228,112 L226.4,107.6 L222,106 L226.4,104.4Z" fill="#fff" class="tw" style="animation-delay:-2.96s" filter="url(#glow)"/><path d="M123,91 L124.6,95.4 L129,97 L124.6,98.6 L123,103 L121.4,98.6 L117,97 L121.4,95.4Z" fill="#fff" class="tw" style="animation-delay:-0.35s" filter="url(#glow)"/><path d="M320,20 L321.6,24.4 L326,26 L321.6,27.6 L320,32 L318.4,27.6 L314,26 L318.4,24.4Z" fill="#fff" class="tw" style="animation-delay:-1.55s" filter="url(#glow)"/><clipPath id="gx"><rect width="590" height="300" rx="22"/></clipPath><g clip-path="url(#gx)"><g transform="skewX(-22)"><rect x="-260" y="-20" width="110" height="340" fill="url(#gl)"><animateTransform attributeName="transform" type="translate" values="0 0;0 0;1110 0;1110 0" keyTimes="0;0.08;0.53;1" dur="6s" repeatCount="indefinite"/></rect></g></g></g></svg>