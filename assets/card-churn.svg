<svg xmlns="http://www.w3.org/2000/svg" width="590" height="300" viewBox="0 0 590 300"><style>.fb{transform-box:fill-box;transform-origin:center}.fl{animation:fl 4s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}.pu{animation:pu 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.4);opacity:.5}}.br{animation:br 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}.bn{animation:bn 1.2s ease-in-out infinite}@keyframes bn{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}.bk{animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}.sp{animation:sp 9s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}.ch{animation:ch 1.8s ease-in-out infinite}@keyframes ch{0%,100%{opacity:.15}50%{opacity:1}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0720"/><stop offset="1" stop-color="#1E1048"/></linearGradient><linearGradient id="vm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#D946EF"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="38"/></filter></defs><rect width="590" height="300" rx="22" fill="url(#bg)"/><text x="560" y="150" text-anchor="end" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="130" font-weight="800" fill="#8B5CF6" opacity=".08">04</text><circle cx="520" cy="20" r="70" fill="#D946EF" opacity=".25" filter="url(#blur)" class="fl"/><rect x="1.5" y="1.5" width="587" height="297" rx="21" fill="none" stroke="#8B5CF6" stroke-opacity=".35" stroke-width="2"/><rect x="1.5" y="1.5" width="587" height="297" rx="21" fill="none" stroke="url(#vm)" stroke-width="3" pathLength="1000" stroke-dasharray="110 890" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect><rect x="521.0" y="24" width="43.0" height="26" rx="13" fill="url(#vm)"/><text x="542.5" y="42" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#fff">ML</text><text x="26" y="56" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#F5F3FF">Prédiction de churn e-commerce</text><text x="26" y="84" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#22D3EE">Machine Learning</text><text x="26" y="122" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E4DCFF">Clustering, classification du churn et régression optimisés avec</text><text x="26" y="145" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#E4DCFF">Optuna, déployés via une API Flask de prédiction en temps réel.</text><rect x="26" y="214" width="124" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="88" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">Scikit-learn</text><rect x="160.39999999999998" y="214" width="75" height="30" rx="15" fill="#8B5CF6" fill-opacity=".2" stroke="#8B5CF6" stroke-opacity=".5"/><text x="198" y="234" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#DDD2FF">