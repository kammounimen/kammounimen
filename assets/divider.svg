ation="38"/></filter></defs><path d="M0,42 H250 L282,20 H520 L552,42 H760 L792,20 H1010 L1042,42 H1200" fill="none" stroke="#8B5CF6" stroke-opacity=".25" stroke-width="3"/><path d="M0,42 H250 L282,20 H520 L552,42 H760 L792,20 H1010 L1042,42 H1200" fill="none" stroke="url(#vm)" stroke-width="3" stroke-dasharray="14 10" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="0" to="-48" dur="1.4s" repeatCount="indefinite"/></path><circle cx="250" cy="42" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="282" cy="20" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="520" cy="20" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="552" cy="42" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="760" cy="42" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="792" cy="20" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="1010" cy="20" r="5.5" fill="#8B5CF6" class="pu"/><circle cx="1042" cy="42" r="5.5" fill="#8B5CF6" class="pu"/><circle r="7" fill="#22D3EE" filter="url(#glow)"><animateMotion path="M0,42 H250 L282,20 H520 L552,42 H760 L792,20 H1010 L1042,42 H1200" dur="6s" repeatCount="indefinite"/></circle></svg>